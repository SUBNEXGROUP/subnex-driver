<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Confirm your collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* Две темы: клиентам с сайта — тёмная в стиле subnex.co.uk, партнёрским — светлая, как раньше. */
      :root {
        --bg: #f3f6f4;
        --card: #ffffff;
        --ink: #17201b;
        --muted: #5f6b64;
        --line: #dfe6e1;
        --soft: #f3f6f4;
        --green: #1f9d55;
        --green-ink: #ffffff;
        --red: #b3261e;
        --head: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      body.site {
        --bg: #0d0d1a;
        --card: #1c1c30;
        --ink: #ffffff;
        --muted: #8888aa;
        --line: #2a2a44;
        --soft: #12121f;
        --green: #2ecc71;
        --green-ink: #0a1a0d;
        --red: #ff6b6b;
        --head: 'Poppins', Arial, sans-serif;
        --body: 'Inter', Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.55 var(--body);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px;
      }
      .logo {
        display: none;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 480px;
        margin-bottom: 18px;
        text-decoration: none;
      }
      body.site .logo {
        display: flex;
      }
      .logo img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }
      .logo b {
        display: block;
        font: 800 18px/1.1 var(--head);
        color: #fff;
      }
      .logo small {
        display: block;
        font: 700 10px/1.2 var(--head);
        letter-spacing: 3px;
        color: var(--green);
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 30px 26px;
      }
      .eyebrow {
        font: 700 11px/1 var(--head);
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 12px;
      }
      h1 {
        font: 800 25px/1.2 var(--head);
        letter-spacing: -0.4px;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 16px;
      }
      .muted {
        color: var(--muted);
      }
      .info {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin: 18px 0 20px;
      }
      .info div {
        padding: 13px 16px;
      }
      .info div + div {
        border-top: 1px solid var(--line);
      }
      .info small {
        display: block;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .info b {
        font-size: 16px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 100px;
        background: var(--green);
        color: var(--green-ink);
        font: 700 16px/1 var(--head);
        padding: 16px 18px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .other {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .other h2 {
        font: 700 15px/1.3 var(--head);
        margin: 0 0 10px;
      }
      .days {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .days button {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 12px;
        font: 600 14px/1.3 var(--body);
        padding: 12px 10px;
      }
      .days button.sel {
        border-color: var(--green);
        color: var(--green);
        background: rgba(46, 204, 113, 0.08);
      }
      .pick {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        font-size: 14px;
        padding: 12px 16px;
      }
      button.danger.solid {
        background: var(--red);
        color: #fff;
      }
      button.danger.sel {
        display: none;
      }
      button.danger {
        background: transparent;
        color: var(--red);
        border: 1px solid var(--red);
        font-size: 15px;
        padding: 13px 16px;
      }
      .days button:hover {
        border-color: var(--green);
        color: var(--green);
      }
      .note {
        font-size: 14px;
        color: var(--muted);
        margin: 16px 0 0;
      }
      .ok {
        color: var(--green);
      }
      .bad {
        color: var(--red);
      }
      .foot {
        margin-top: 18px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      .foot a {
        color: var(--green);
        text-decoration: none;
      }
      @media (max-width: 380px) {
        .days {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <a class="logo" href="https://subnex.co.uk"
      ><img src="https://subnex.co.uk/favicon.png" alt="" />
      <span><b>SUBNEX</b><small>GROUP</small></span></a
    >
    <main class="card" id="card" aria-live="polite">
      <p class="muted">Loading your collection…</p>
    </main>
    <div class="foot" id="foot"></div>
    <script src="config.js"></script>
    <script>
      (function () {
        'use strict';
        const card = document.getElementById('card');
        const qs = new URLSearchParams(location.search);
        /* ?t= — предложение или подтверждённый сбор; ?r= — новая запись по ссылке из письма
           «не смогли забрать» / «отменено». После записи страница сама переходит на ?t= нового сбора. */
        let token = qs.get('t') || '';
        let rebook = token ? '' : qs.get('r') || '';
        const esc = (s) =>
          String(s == null ? '' : s).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
          );

        async function rpc(action, day) {
          const cfg = window.SUBNEX_CONFIG || {};
          const body = { p_token: rebook || token, p_action: action };
          if (day) body.p_day = day;
          const fn = rebook ? 'subnex_rebook' : 'subnex_email_choose';
          const res = await fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: cfg.key, Authorization: 'Bearer ' + cfg.key },
            body: JSON.stringify(body),
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }

        /* С новой записи — на страницу управления этим сбором (перенос, отмена). */
        async function toManage(mt, fresh) {
          rebook = '';
          token = mt;
          try {
            history.replaceState(null, '', location.pathname + '?t=' + mt);
          } catch (e) {}
          const d = await rpc('peek');
          if (fresh) d.rebooked = true;
          show(d);
        }

        const brand = (d) => (d.site ? '' : `<div class="eyebrow">${esc(d.brand || 'SUBNEX')}</div>`);
        const info = (d, withBags) =>
          '<div class="info">' +
          (d.day_text ? `<div><small>Collection date</small><b>${esc(d.day_text)}</b></div>` : '') +
          (d.address ? `<div><small>Collection address</small><b>${esc(d.address)}</b></div>` : '') +
          (withBags && d.bags ? `<div><small>Bags</small><b>${esc(d.bags)}</b></div>` : '') +
          '</div>';
        const reply = '<p class="note">If you have any questions, just reply to our email.</p>';

        function show(d) {
          if (d.site) {
            document.body.classList.add('site');
            document.getElementById('foot').innerHTML =
              'SUBNEX Group · Free home clothing collection across South Wales<br><a href="https://subnex.co.uk">subnex.co.uk</a>';
          }
          if (rebook && /^[0-9a-f]{64}$/.test(d.manage_token || '') && (d.state === 'confirmed' || d.state === 'rebooked')) {
            toManage(d.manage_token, d.state === 'confirmed').catch(() => {
              card.innerHTML =
                '<h1 class="ok">Your new collection is booked</h1>' + info(d, true) + '<p>We have sent you a confirmation email.</p>';
            });
            return;
          }
          if (d.state === 'rebook') {
            const opts = Array.isArray(d.options) ? d.options : [];
            card.innerHTML =
              '<div class="eyebrow">— Book a new date —</div>' +
              '<h1>Choose a new collection date</h1>' +
              info(d, true) +
              (opts.length
                ? '<p class="muted" style="font-size:14px">These are the days we collect in your area. Tap one to choose it.</p><div class="days">' +
                  opts.map((o) => `<button data-book="${esc(o.day)}">${esc(o.day_text)}</button>`).join('') +
                  '</div>'
                : '<p>We have no free dates in your area right now. Please reply to our email and we will arrange a collection for you.</p>');
            card.querySelectorAll('[data-book]').forEach((b) =>
              b.addEventListener('click', () => pick(b, 'Book ' + b.textContent, () => act('book', b.dataset.book), false, 'Choose a different day')),
            );
            return;
          }
          if (d.state === 'active') {
            card.innerHTML =
              '<div class="eyebrow">— Already booked —</div>' +
              '<h1>You already have a collection booked</h1>' +
              info(d, false) +
              '<p>There is already an upcoming collection at this address. Please use the link in our latest email to see or change it, or just reply to the email.</p>';
            return;
          }
          if (d.state === 'sent' && d.ok) {
            const opts = Array.isArray(d.options) ? d.options : [];
            card.innerHTML =
              brand(d) +
              (d.site ? '<div class="eyebrow">— Your collection date —</div>' : '') +
              '<h1>Confirm your clothing collection</h1>' +
              info(d, true) +
              '<button id="go">Confirm this date</button>' +
              (opts.length
                ? '<div class="other"><h2>Does another day suit you better?</h2><p class="muted" style="font-size:14px">These are the days we collect in your area. Tap one to choose it.</p><div class="days">' +
                  opts.map((o) => `<button data-day="${esc(o.day)}">${esc(o.day_text)}</button>`).join('') +
                  '</div></div>'
                : '<p class="note">If this day does not suit you, just reply to our email and tell us which day works better.</p>');
            document.getElementById('go').addEventListener('click', () => confirm(null));
            card.querySelectorAll('[data-day]').forEach((b) =>
              b.addEventListener('click', () => pick(b, 'Book ' + b.textContent, () => confirm(b.dataset.day))),
            );
          } else if (d.state === 'confirmed') {
            const opts = Array.isArray(d.options) ? d.options : [];
            const manage = d.site && d.manage;
            card.innerHTML =
              brand(d) +
              (d.site ? '<div class="eyebrow">— Booking confirmed —</div>' : '') +
              `<h1 class="ok">${d.rebooked ? 'Your new collection is booked' : d.changed ? 'Your new date is confirmed' : d.already ? 'Your collection is booked' : 'Thank you — your collection is confirmed'}</h1>` +
              info(d, true) +
              '<p>On the morning of your collection we will send you a time window. Please leave your bags out that morning where we can see them from the street.</p>' +
              (manage && opts.length
                ? '<div class="other"><h2>Need a different day?</h2><p class="muted" style="font-size:14px">These are the days we collect in your area. Tap one to move your collection.</p><div class="days">' +
                  opts.map((o) => `<button data-move="${esc(o.day)}">${esc(o.day_text)}</button>`).join('') +
                  '</div></div>'
                : '') +
              (manage
                ? '<div class="other"><h2>Can no longer make it?</h2><button id="cancel" class="danger">Cancel my collection</button></div>'
                : reply);
            card.querySelectorAll('[data-move]').forEach((b) =>
              b.addEventListener('click', () => pick(b, 'Move to ' + b.textContent, () => act('change', b.dataset.move))),
            );
            const c = document.getElementById('cancel');
            if (c)
              c.addEventListener('click', () =>
                pick(c, 'Yes, cancel my collection on ' + (d.day_text || 'this day'), () => act('cancel', null), true),
              );
          } else if (d.state === 'cancelled') {
            card.innerHTML =
              brand(d) +
              (d.site ? '<div class="eyebrow">— Booking cancelled —</div>' : '') +
              '<h1>Your collection has been cancelled</h1>' +
              info(d, false) +
              '<p>No problem — we will not come. If you would like a collection in the future, you can book again any time.</p>' +
              '<button onclick="location.href=\'https://subnex.co.uk/#booking\'">Book a new collection</button>';
          } else if (d.state === 'locked') {
            card.insertAdjacentHTML(
              'beforeend',
              '<p class="note bad">Your collection is already on its way today, so it can no longer be changed online. Please reply to our email.</p>',
            );
          } else if (d.state === 'day_taken') {
            card.insertAdjacentHTML(
              'beforeend',
              '<p class="note bad">Sorry, that day has just filled up. Please choose another day.</p>',
            );
            document.querySelectorAll('#card button').forEach((b) => (b.disabled = false));
          } else if (d.state === 'invalid') {
            card.innerHTML =
              '<h1 class="bad">This link does not work</h1><p>Please open the link from our email again, or reply to the email and we will help.</p>';
          } else {
            card.innerHTML =
              brand(d) +
              '<h1 class="bad">This date is no longer available</h1>' +
              info(d, false) +
              '<p>Please reply to our email and we will arrange a new date for your collection.</p>';
          }
        }

        /* Выбор дня или отмена — сначала только выделение и кнопка подтверждения под ним.
           Ничего не отправляется, пока клиент не нажмёт её; «Keep my current choice» всё отменяет. */
        function pick(btn, label, run, danger, noLabel) {
          card.querySelectorAll('.pick').forEach((x) => x.remove());
          card.querySelectorAll('.sel').forEach((x) => x.classList.remove('sel'));
          btn.classList.add('sel');
          const box = document.createElement('div');
          box.className = 'pick';
          box.innerHTML =
            `<button class="${danger ? 'danger solid' : ''}" data-yes>${esc(label)}</button>` +
            `<button class="ghost" data-no>${esc(noLabel || 'Keep my current choice')}</button>`;
          (btn.closest('.days') || btn).insertAdjacentElement('afterend', box);
          box.querySelector('[data-yes]').addEventListener('click', run);
          box.querySelector('[data-no]').addEventListener('click', () => {
            box.remove();
            btn.classList.remove('sel');
          });
          box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function act(action, day) {
          const buttons = document.querySelectorAll('#card button');
          buttons.forEach((b) => (b.disabled = true));
          try {
            show(await rpc(action, day));
          } catch (e) {
            buttons.forEach((b) => (b.disabled = false));
            card.insertAdjacentHTML('beforeend', '<p class="note bad">Something went wrong. Please try again in a minute.</p>');
          }
        }

        async function confirm(day) {
          const buttons = document.querySelectorAll('#card button');
          buttons.forEach((b) => (b.disabled = true));
          const go = document.getElementById('go');
          if (go && !day) go.textContent = 'Confirming…';
          try {
            show(await rpc('confirm', day));
          } catch (e) {
            buttons.forEach((b) => (b.disabled = false));
            if (go) go.textContent = 'Confirm this date';
            card.insertAdjacentHTML('beforeend', '<p class="note bad">Something went wrong. Please try again in a minute.</p>');
          }
        }

        if (!/^[0-9a-f]{64}$/.test(rebook || token)) {
          show({ state: 'invalid' });
          return;
        }
        if (rebook) document.body.classList.add('site');
        rpc('peek')
          .then(show)
          .catch((e) => {
            console.error(e);
            card.innerHTML = '<h1 class="bad">Something went wrong</h1><p>Please try again in a minute.</p>';
          });
      })();
    </script>
  </body>
</html>
